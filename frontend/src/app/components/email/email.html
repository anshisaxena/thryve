<div class="container">
  <div class="center-blob"></div>
   <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="blob blob5"></div>
  <div class="card">
    <h2 class="logo">TANDEM</h2>
    <p class="subtitle">Enter your work email address</p>

    <input type="email" [(ngModel)]="email" placeholder="Email" class="input" />

    <button class="btn" (click)="submitEmail()">Continue</button>
  </div>
</div>
