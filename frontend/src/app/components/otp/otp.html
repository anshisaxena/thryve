<div class="container">
  <div class="center-blob"></div>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="blob blob5"></div>
  <div class="card">
    <h2 class="logo">TANDEM</h2>
    <p class="subtitle">
      We sent you a passcode to <strong>{{ email }}</strong>
    </p>

    <div class="otp-box">
      <input
        *ngFor="let digit of otp; let i = index"
        id="otp-{{ i }}"
        type="text"
        maxlength="1"
        [value]="otp[i]"
        (input)="moveNext($event, i)"
        (keydown)="handleKeyDown($event, i)"
        class="otp-input"
      />
    </div>

    <button class="btn" (click)="verifyOtp()">Continue</button>
  </div>
</div>
